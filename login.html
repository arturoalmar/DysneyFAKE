<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeoCosas - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        .auth-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #333 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .auth-card {
            background: #fff;
            padding: 40px;
            border: 4px solid #000;
            box-shadow: 10px 10px 0 #ffde00;
            max-width: 400px;
            width: 100%;
            transform: rotate(-1deg);
        }

        .auth-title {
            font-family: 'Bangers', cursive;
            font-size: 3rem;
            color: #ff0055;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            color: #000;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 3px solid #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            outline: none;
            background: #fff;
            line-height: normal;
        }

        .form-group input:focus {
            background: #fffde7;
        }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            background: #ffde00;
            border: 2px solid #000;
            cursor: pointer;
            width: 32px;
            height: 32px;
            padding: 5px;
            box-shadow: 2px 2px 0 #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .toggle-password svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .toggle-password:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 #000;
        }

        .toggle-password:active {
            transform: translate(1px, 1px);
            box-shadow: 0 0 0 #000;
        }

        .auth-btn {
            width: 100%;
            background: #ffde00;
            color: #000;
            border: 3px solid #000;
            padding: 15px;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 7px 7px 0 #000;
            background: #ff0055;
            color: #fff;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            color: #333;
            font-weight: 600;
        }

        .toggle-auth a {
            color: #ff0055;
            text-decoration: none;
            cursor: pointer;
        }

        .auth-error {
            background: #ffcccc;
            color: #d00;
            border: 2px solid #000;
            padding: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }

        /* Overlay for transition */
        .page-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.5s ease-in-out;
        }

        .page-overlay.active {
            transform: scaleY(1);
        }
    </style>
</head>

<body>
    <div class="page-overlay" id="pageOverlay"></div>
    <div class="auth-wrapper">
        <div class="auth-card" id="authCard">
            <h1 class="auth-title">VeoCosas</h1>

            <div id="authError" class="auth-error"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label>Usuario o Email</label>
                    <div class="input-wrapper">
                        <input type="text" id="loginIdentifier" required placeholder=" ">
                    </div>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="password-container">
                        <div class="input-wrapper" style="flex-grow: 1;">
                            <input type="password" id="loginPassword" required placeholder=" ">
                        </div>
                        <button type="button" class="toggle-password" title="Ver contraseña">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 10s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                                <line x1="12" y1="3" x2="12" y2="1"></line>
                                <line x1="5" y1="5" x2="4" y2="3"></line>
                                <line x1="19" y1="5" x2="20" y2="3"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="auth-btn">ENTRAR</button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>Usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="regUsername" required placeholder=" ">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="regEmail" required placeholder=" ">
                    </div>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="password-container">
                        <div class="input-wrapper" style="flex-grow: 1;">
                            <input type="password" id="regPassword" required placeholder=" ">
                        </div>
                        <button type="button" class="toggle-password" title="Ver contraseña">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 10s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                                <line x1="12" y1="3" x2="12" y2="1"></line>
                                <line x1="5" y1="5" x2="4" y2="3"></line>
                                <line x1="19" y1="5" x2="20" y2="3"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="auth-btn">REGISTRARME</button>
            </form>

            <div class="toggle-auth">
                <span id="toggleText">¿No tienes cuenta? <a id="toggleLink">Regístrate</a></span>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
